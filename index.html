<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .header {
            color: green;
            font-size: 30px;
            padding: 20px 40px;
        }

        .fix-top-right {
            position: fixed;
            right: 0;
            top: 0;
        }
    </style>
</head>
<body>
<h1 class="fix-top-right header">Заголовок</h1>

<p>Это мой текст</p>
<div id="myDiv" class=header>
    123
</div>
<button id = "btn">Нажать</button>
<label>
    <input type="text" name="text" placeholder="Ввести">
</label>

<script >
    console.log('first try javasrpict')
    let a = 10, b = 20;
    let int = null
    const elem = document.getElementById('myDiv')
    if (elem) {
        int = setInterval(()=> {
            elem.innerHTML = a++;
        },100)
    }
    console.log(a + b)

    const btn = document.getElementById('btn')
    btn.addEventListener('click',()=> {
        if (int) {
            clearInterval(int)
            int = null
        } else {
            int = setInterval(()=> {
                elem.innerHTML = a++;
            },100)
        }
    })
</script>
<img src="https://i.pinimg.com/474x/79/35/c9/7935c9f91838e6e3761bf84193cb8fd1.jpg?nii=t">
</body>
</html>
